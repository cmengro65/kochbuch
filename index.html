/* =====================================================================
   Kochbuch – Stilrichtung „Kräutergarten“ (Entwurf 13.11.2026)
   Grundlage für den Umbau von app/index.html.
   Farben: Palette A (gestaltung/03-farbe.md), ergänzt um Lavendel (Thermomix)
   und Senf (Wecker). Jede Farbe hat genau eine Bedeutung:
     Tannengrün  --akzent  = Handlung (Hauptknopf, aktiver Reiter, Zähler, Haken)
     Lavendel    --tm      = Thermomix (Umschalter, Gerätanzeige, Werte im Text)
     Senf        --zeit    = Wecker (starten und laufend)
     Oliv        --gruen   = Saison
     Ziegelrot   --warn    = Allergene, Löschen, Fehler
   Schrift: Atkinson Hyperlegible Next (Überschriften und Text) + Vollkorn (nur Mengen und Zahlen),
   beide SIL OFL 1.1, lokal als woff2. Größen/Abstände: Utopia (02-schrift.md).
   Symbole: Lucide 0.577 (ISC), inline SVG, Strich 2.
   ===================================================================== */

/* ---------- Schriften ---------- */
@font-face{font-family:'Vollkorn';font-style:normal;font-weight:400 900;font-display:swap;
  src:url(vollkorn-v30-latin.woff2) format('woff2');

  src:url(vollkorn-v30-latinext.woff2) format('woff2');
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Atkinson Hyperlegible Next';font-style:normal;font-weight:200 800;font-display:swap;
  src:url(atkinson-next-v7-latin.woff2) format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}

/* ---------- Grundwerte ---------- */
:root{
  color-scheme:light dark;
  /* Farben hell – vorhandene Variablen der App */
  --bg:#e9efeb;          /* Salbeigrau, Seite */
  --karte:#ffffff;       /* Felder, Leiste, Flächen */
  --text:#18211d;
  --leise:#56615c;       /* Nebentext, ≥ 5,6 : 1 auf --bg */
  --linie:#cfdad3;
  --akzent:#1f6a4a;      /* Tannengrün = Handlung */
  --akzent-hell:#dcebe2;
  --gruen:#4d6b16;       /* Oliv = Saison */
  --warn:#a8321f;        /* Ziegel = Allergene, Löschen */
  --warn-hell:#fbe7e2;
  --schatten:0 1px 2px rgba(20,40,30,.07),0 4px 14px rgba(20,40,30,.05);
  /* neu */
  --aufakzent:#ffffff;   /* Schrift auf --akzent */
  --stern:#18211d;       /* Sterne in Tinte, nicht gelb (Gelb gehört dem Wecker) */
  /* neu: Thermomix (Lavendel) */
  --tm:#5b3f86;  --tm-hell:#ebe5f3;  --tm-tief:#2b2338;  --tm-text:#ffffff;  --tm-linie:rgba(255,255,255,.2);
  /* neu: Wecker (Senf) */
  --zeit:#7a5200; --zeit-hell:#f5e6bd; --zeit-tief:#3a2700; --zeit-rand:#d9b45a;

  /* Schriftrollen */
  --f-head:'Atkinson Hyperlegible Next',system-ui,sans-serif;  /* Entscheidung: nicht Vollkorn, siehe 08-kraeutergarten.md */
  --f-text:'Atkinson Hyperlegible Next',system-ui,sans-serif;
  --f-num:'Vollkorn',Georgia,serif;

  /* Utopia: 320→1240 px, 18→20 px, 1,2→1,25 */
  --step-n2:clamp(0.7813rem,0.7747rem + 0.0326vi,0.8rem);
  --step-n1:clamp(0.9375rem,0.9158rem + 0.1087vi,1rem);
  --step-0:clamp(1.125rem,1.0815rem + 0.2174vi,1.25rem);
  --step-1:clamp(1.35rem,1.2761rem + 0.3696vi,1.5625rem);
  --step-2:clamp(1.62rem,1.5041rem + 0.5793vi,1.9531rem);
  --step-3:clamp(1.944rem,1.771rem + 0.8651vi,2.4414rem);
  --step-4:clamp(2.3328rem,2.0827rem + 1.2504vi,3.0518rem);
  --step-5:clamp(2.7994rem,2.4462rem + 1.7658vi,3.8147rem);
  --space-3xs:clamp(0.2813rem,0.2704rem + 0.0543vi,0.3125rem);
  --space-2xs:clamp(0.5625rem,0.5408rem + 0.1087vi,0.625rem);
  --space-xs:clamp(0.8438rem,0.8111rem + 0.163vi,0.9375rem);
  --space-s:clamp(1.125rem,1.0815rem + 0.2174vi,1.25rem);
  --space-m:clamp(1.6875rem,1.6223rem + 0.3261vi,1.875rem);
  --space-l:clamp(2.25rem,2.163rem + 0.4348vi,2.5rem);
  --space-xl:clamp(3.375rem,3.2446rem + 0.6522vi,3.75rem);
  --space-2xl:clamp(4.5rem,4.3261rem + 0.8696vi,5rem);
  --space-s-m:clamp(1.125rem,0.8641rem + 1.3043vi,1.875rem);
  --space-m-l:clamp(1.6875rem,1.4049rem + 1.413vi,2.5rem);

  /* Formen: Rangfolge statt ein Radius für alles */
  --r-foto:6px; --r-feld:10px; --r-anzeige:16px; --r-rund:999px;
  --rand:var(--space-s);           /* Seitenrand */
  --spalte:42rem;                  /* Textspalte max. */
  --leiste-h:64px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1513; --karte:#18211d; --text:#e8eeea; --leise:#a3b0aa; --linie:#2c3632;
    --akzent:#6fbf96; --akzent-hell:#173126; --gruen:#b5d47a; --warn:#ff9b86; --warn-hell:#3a1d18;
    --schatten:none;
    --aufakzent:#0c2118; --stern:#e8eeea;
    --tm:#c6b3ec; --tm-hell:#272035; --tm-tief:#211b2c; --tm-text:#1b1328; --tm-linie:rgba(255,255,255,.14);
    --zeit:#f0c56a; --zeit-hell:#33270c; --zeit-tief:#f6dc9c; --zeit-rand:#6b5216;
  }
}

/* ---------- Grundlage ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:var(--step-0);line-height:1.5;
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--akzent);outline-offset:2px;border-radius:4px}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.klein{width:20px;height:20px}
.bruch{font-variant-numeric:diagonal-fractions}
.nb{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.seite{max-width:var(--spalte);margin:0 auto;padding:0 var(--rand) calc(var(--leiste-h) + var(--space-l) + env(safe-area-inset-bottom))}
.vollbreit{margin-inline:calc(-1 * var(--rand))}

/* ---------- Kopfzeile ---------- */
.kopf{display:flex;align-items:center;gap:var(--space-2xs);min-height:60px;padding-top:env(safe-area-inset-top)}
.kopf h1{font-size:var(--step-3);font-weight:800;letter-spacing:-.03em}
.kopf .zurueck{display:flex;align-items:center;gap:2px;height:48px;margin-left:-10px;padding-right:12px;font-weight:600;color:var(--text)}
.kopf .rechts{margin-left:auto;color:var(--leise);font-size:var(--step-n1)}

/* ---------- Leiste unten (Form wie heute: drei Ziele) ---------- */
.leiste{position:fixed;inset:auto 0 0 0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--karte);border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom)}
.leiste a{position:relative;height:var(--leiste-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:var(--step-n2);font-weight:600;color:var(--leise)}
.leiste a[aria-current=page]{color:var(--akzent)}
.leiste a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--akzent)}
.leiste .zaehler{position:absolute;top:8px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-rund);
  background:var(--akzent);color:var(--aufakzent);font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--karte)}

/* ---------- Felder und Knöpfe ---------- */
.feld{display:flex;align-items:center;gap:var(--space-2xs);height:52px;padding:0 14px;background:var(--karte);
  border:1px solid var(--linie);border-radius:var(--r-feld)}
.feld input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:var(--step-0)}
.feld input::placeholder{color:var(--leise)}
.feld .i{color:var(--leise)}
.feld:focus-within{border-color:var(--akzent);box-shadow:0 0 0 1px var(--akzent)}
.feld .feldknopf{width:44px;height:44px;margin-right:-10px;display:grid;place-items:center;color:var(--leise)}

.knopf{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 20px;border-radius:var(--r-feld);
  font-weight:700;font-size:var(--step-0);line-height:1.2;text-align:center}
.knopf.haupt{background:var(--akzent);color:var(--aufakzent)}
.knopf.neben{background:var(--karte);border:1px solid var(--linie);color:var(--text)}
.knopf.leise{min-height:48px;padding:0 10px;font-weight:600;color:var(--leise)}
.knopf.warn{color:var(--warn)}
.knopf.voll{width:100%}
.knoepfe{display:flex;gap:var(--space-2xs);flex-wrap:wrap}
.knoepfe > *{flex:1}

/* ---------- Abschnitte (offen, ohne Kasten) ---------- */
.abschnitt{padding-top:var(--space-l)}
.abschnitt > h2{font-size:var(--step-2);margin-bottom:var(--space-xs)}
.abschnitt-kopf{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-xs);margin-bottom:var(--space-xs)}
.abschnitt-kopf h2{font-size:var(--step-2)}
.hinweis{color:var(--leise);font-size:var(--step-n1);line-height:1.45}
.trenner{border:0;border-top:1px solid var(--linie);margin:0}

/* ---------- Startseite ---------- */
.suche{margin-top:var(--space-3xs)}
.filter{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:var(--space-xs) var(--rand);margin-inline:calc(-1 * var(--rand))}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;height:44px;padding:0 16px;display:flex;align-items:center;gap:6px;border-radius:var(--r-feld);
  background:var(--karte);border:1px solid var(--linie);font-weight:600;font-size:var(--step-n1);white-space:nowrap}
.filter button[aria-pressed=true]{background:var(--akzent);border-color:var(--akzent);color:var(--aufakzent)}
.filter button small{font-size:inherit;font-weight:500;opacity:.8}

.saison{display:block;margin-top:var(--space-2xs)}
.saison img{width:100%;aspect-ratio:4/3;object-fit:cover}
.saison .unter{padding:var(--space-xs) 0 0}
.saison .zeile{display:flex;align-items:center;gap:6px;color:var(--gruen);font-weight:600;font-size:var(--step-n1)}
.saison h2{font-size:var(--step-3);margin-top:4px}

.raster-kopf{display:flex;align-items:baseline;justify-content:space-between;margin:var(--space-xl) 0 var(--space-xs)}
.raster-kopf h2{font-size:var(--step-2)}
.raster-kopf span{color:var(--leise);font-size:var(--step-n1)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--space-m) var(--space-xs);list-style:none;padding:0}
.kachel img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:var(--r-foto);background:var(--linie)}
.kachel b{display:block;margin-top:var(--space-2xs);font-family:var(--f-head);font-weight:700;font-size:var(--step-0);line-height:1.2;letter-spacing:-.01em;
  hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kachel span{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--leise);font-size:var(--step-n1)}
.kachel .tm{display:inline-flex;color:var(--tm)}
.kachel .tm .i{width:18px;height:18px}

/* Leerer Zustand */
.leer{padding:var(--space-xl) 0 var(--space-l);max-width:30rem}
.leer .gross{width:56px;height:56px;color:var(--leise);stroke-width:1.6}
.leer h2{font-size:var(--step-3);margin:var(--space-s) 0 var(--space-2xs)}
.leer p{color:var(--leise)}
.leer .vorschlaege{display:flex;flex-wrap:wrap;gap:8px;margin:var(--space-s) 0 var(--space-m)}
.leer .vorschlaege button{height:44px;padding:0 14px;border-radius:var(--r-feld);background:var(--karte);border:1px solid var(--linie);font-weight:600;font-size:var(--step-n1)}
.leer .vorschlaege button small{color:var(--leise);font-weight:500;font-size:inherit;margin-left:4px}

/* ---------- Rezept ---------- */
.foto{width:100%;aspect-ratio:4/3;object-fit:cover}
.titel{font-size:var(--step-4);font-weight:800;line-height:1.02;letter-spacing:-.035em;margin-top:var(--space-s);hyphens:auto}
.kurz{font-size:var(--step-0);line-height:1.45;color:var(--leise);margin-top:var(--space-2xs)}
.fakten{list-style:none;padding:0;margin:var(--space-xs) 0 0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:var(--step-n1)}
.fakten li{display:flex;align-items:flex-start;gap:7px;line-height:1.4}
.fakten .i{width:20px;height:20px;margin-top:1px}
.fakten .tm{color:var(--tm);font-weight:650}
.fakten .saison-f{color:var(--gruen)}
.fakten .allergen{color:var(--warn);font-weight:650}
.fakten .leise{color:var(--leise)}
.handlungen{display:grid;gap:var(--space-2xs);margin-top:var(--space-s)}
.handlungen .klein{display:flex;justify-content:center;gap:var(--space-s)}

.portionen{display:flex;align-items:center;gap:2px;background:var(--karte);border:1px solid var(--linie);border-radius:var(--r-feld);padding:3px}
.portionen button{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;color:var(--akzent)}
.portionen output{min-width:2.6em;text-align:center;font-family:var(--f-num);font-weight:700;font-size:var(--step-1);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.portionen output small{display:block;font-family:var(--f-text);font-size:12px;font-weight:600;color:var(--leise);margin-top:2px}
.umgerechnet{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--step-n1);color:var(--leise);margin:-4px 0 var(--space-2xs)}
.umgerechnet button{color:var(--akzent);font-weight:700;min-height:44px}

.zutaten{list-style:none;padding:0;border-top:1px solid var(--linie)}
.zutaten li{display:grid;grid-template-columns:5.6rem 1fr;gap:var(--space-xs);padding:11px 0;border-bottom:1px solid var(--linie);align-items:baseline}
.zutaten .m{text-align:right;font-family:var(--f-num);font-weight:700;font-size:var(--step-0);font-variant-numeric:lining-nums tabular-nums;white-space:nowrap}
.zutaten .m small{font-family:var(--f-num);font-weight:500;font-size:inherit}
.zutaten .n{line-height:1.35}
.zutaten .n em{display:block;font-style:normal;color:var(--leise);font-size:var(--step-n1)}

.fassung{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--karte);border:1px solid var(--linie);border-radius:14px}
.fassung button{height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;color:var(--leise);font-size:var(--step-n1)}
.fassung button[data-f=thermomix][aria-pressed=true]{background:var(--tm);color:var(--tm-text)}
.fassung button[data-f=klassisch][aria-pressed=true]{background:var(--text);color:var(--bg)}
.fassung.klein button{height:46px}

.schritte{list-style:none;padding:0;margin-top:var(--space-s);counter-reset:s}
.schritte li{display:grid;grid-template-columns:2.2rem 1fr;gap:var(--space-xs);padding:var(--space-xs) 0 var(--space-s)}
.schritte li + li{border-top:1px solid var(--linie);padding-top:var(--space-s)}
.schritte .nr{font-family:var(--f-num);font-weight:700;font-size:var(--step-3);line-height:.9;color:var(--leise);font-variant-numeric:lining-nums}
.schritte p{line-height:1.55}
.tmwert{background:var(--tm-hell);color:var(--tm);font-weight:700;border-radius:5px;padding:1px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}

.anm p + p{margin-top:var(--space-2xs)}
.quelle{margin-top:var(--space-s);color:var(--leise);font-size:var(--step-n1)}
.tb{list-style:none;padding:0;border-top:1px solid var(--linie)}
.tb li{padding:var(--space-xs) 0;border-bottom:1px solid var(--linie)}
.tb .tb-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.sterne{display:inline-flex;gap:2px;color:var(--stern)}
.sterne .i{width:18px;height:18px}
.sterne .voll{fill:currentColor}
.sterne .aus{opacity:.35}
.tb p{margin-top:4px}

/* ---------- Kochmodus ---------- */
.koch{min-height:100dvh;display:flex;flex-direction:column;max-width:var(--spalte);margin:0 auto;
  padding:env(safe-area-inset-top) var(--rand) 0}
.koch-kopf{display:flex;align-items:center;gap:var(--space-2xs);min-height:58px}
.koch-kopf .zu{width:48px;height:48px;display:grid;place-items:center;margin-left:-12px;border-radius:12px}
.koch-kopf div{flex:1;min-width:0;line-height:1.15}
.koch-kopf b{display:block;font-family:var(--f-head);font-weight:800;font-size:var(--step-0);line-height:1.15;letter-spacing:-.01em}
.koch-kopf span{font-size:var(--step-n1);color:var(--leise)}
.fortschritt{display:flex;align-items:center;gap:var(--space-xs);margin:var(--space-2xs) 0 var(--space-xs)}
.fortschritt ol{flex:1;display:flex;gap:5px;list-style:none;padding:0}
.fortschritt li{flex:1;height:8px;border-radius:4px;background:var(--linie)}
.fortschritt li.fertig{background:var(--leise)}
.fortschritt li.jetzt{background:var(--text)}
.fortschritt span{font-size:var(--step-n1);color:var(--leise);white-space:nowrap}
.fortschritt span b{color:var(--text);font-family:var(--f-num);font-size:var(--step-1);font-variant-numeric:lining-nums}

.anzeige{background:var(--tm-tief);color:#fff;border-radius:var(--r-anzeige);padding:var(--space-xs) var(--space-s) var(--space-xs)}

/* ---------- Verschlüsselung (AES-GCM, Schlüssel aus Passwort per PBKDF2) ---------- */
function zuB64(buf){ const u = new Uint8Array(buf); let s = ''; for(let i=0;i<u.length;i+=0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); }
function ausB64(s){ const b = atob(s); const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return u; }
async function schluesselAusPasswort(pw, salzB64, iter){
  const basis = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:ausB64(salzB64), iterations:iter}, basis, 256);
  return zuB64(bits);
}
async function aes(roh){ return crypto.subtle.importKey('raw', ausB64(roh), 'AES-GCM', false, ['encrypt','decrypt']); }
async function entschluesseln(umschlag, roh){
  const klar = await crypto.subtle.decrypt({name:'AES-GCM', iv:ausB64(umschlag.iv)}, await aes(roh), ausB64(umschlag.ct));
  return JSON.parse(new TextDecoder().decode(klar));
}
async function verschluesseln(obj, roh, salz, iter){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await aes(roh), new TextEncoder().encode(JSON.stringify(obj)));
  return {v:1, salt:salz, iter, iv:zuB64(iv), ct:zuB64(ct)};
}

async function ladeUmschlag(datei){
  try{
    const r = await fetch(datei + '?t=' + Date.now(), {cache:'no-store'});
    if(r.ok){ const j = await r.json(); speicher.set('cache.'+datei, j); return j; }
    if(r.status === 404) return null;
  }catch(e){}
  return speicher.get('cache.'+datei, null);
}

async function start(){
  UMSCHLAG = await ladeUmschlag('daten.enc');
  if(!UMSCHLAG){ zeigeAnmeldung('Das Kochbuch konnte nicht geladen werden. Bitte einmal mit Internet öffnen.'); return; }
  if(SCHL && SCHL.salt === UMSCHLAG.salt){
    try{ DATEN = await entschluesseln(UMSCHLAG, SCHL.roh); }catch(e){ DATEN = null; }
  }
  if(!DATEN){ zeigeAnmeldung(SCHL ? 'Das Passwort hat sich geändert. Bitte neu eingeben.' : ''); return; }
  await ladeTagebuch();
  // Gespeicherte Anmeldung vor dem Aufräumen durch den Browser schützen
  try{ navigator.storage?.persist?.(); }catch(e){}
  // Alle Fotos im Hintergrund laden, damit sie auch ohne Internet da sind – zuerst die kleinen fürs Raster
  setTimeout(async () => {
    for(const u of [...DATEN.rezepte.map(r => r.klein), ...DATEN.rezepte.map(r => r.bild)].filter(Boolean)){
      try{ await fetch(u); }catch(e){ return; }
    }
  }, 3000);
  $('#anmeldung').hidden = true; $('#app').hidden = false;
  zeigen();
}

async function ladeTagebuch(){
  const u = await ladeUmschlag('tagebuch.enc');
  // Ein frisch gespeicherter Eintrag kann auf der Webseite noch eine Minute fehlen – lokale Fassung gewinnt dann.
  const lokal = speicher.get('tagebuchLokal', null);
  try{ if(u) TB = await entschluesseln(u, SCHL.roh); }catch(e){}
  if(lokal && (!TB.stand || lokal.stand > TB.stand)) TB = lokal;
  TB.eintraege ||= {};
}

/* ---------- Mengen ---------- */
function runde(x, e){
  e = (e||'').toLowerCase();
  if(['g','ml'].includes(e)){ if(x >= 100) return Math.round(x/5)*5; if(x >= 10) return Math.round(x); return Math.round(x*10)/10; }
  if(['kg','l'].includes(e)) return Math.round(x*100)/100;
  const q = Math.round(x*4)/4, t = Math.round(x*3)/3;
  return Math.abs(t-x) < Math.abs(q-x) - 1e-9 ? t : q;
}
// Zahl zerlegen: ganzer Teil + Bruch (¼ ½ ¾ ⅓ ⅔) oder Dezimalzahl
function zahlTeile(x){
  if(x >= 10 || Math.abs(x - Math.round(x)) < 0.01) return {g: String(Math.round(x*100)/100).replace('.', ','), b: ''};
  const g = Math.floor(x + 1e-9), r = x - g;
  const br = [[.25,'1/4','¼'],[.5,'1/2','½'],[.75,'3/4','¾'],[1/3,'1/3','⅓'],[2/3,'2/3','⅔']].find(([w]) => Math.abs(r-w) < .02);
  if(br) return {g: g ? String(g) : '', b: br[1], u: br[2]};
  return {g: String(Math.round(x*100)/100).replace('.', ','), b: ''};
}
const zahl = x => { const t = zahlTeile(x); return t.g + (t.u || ''); };                       // für Text (Teilen, Erinnerungen)
const zahlHtml = x => { const t = zahlTeile(x); return esc(t.g) + (t.b ? `<span class="bruch">${t.b}</span>` : ''); }; // für die Anzeige
function mengeWert(m, einheit, faktor = 1){
  if(m == null || m === '') return null;
  let x = m * faktor, e = einheit || '';
  if(e === 'kg'){ x *= 1000; e = 'g'; }
  if(e === 'l'){ x *= 1000; e = 'ml'; }
  if(e === 'g' && x >= 1000){ x /= 1000; e = 'kg'; }
  if(e === 'ml' && x >= 1000){ x /= 1000; e = 'l'; }
  x = runde(x, e);
  if(x === 0) x = m * faktor;
  return {x, e};
}
function mengeText(m, einheit, faktor = 1){ const w = mengeWert(m, einheit, faktor); return w ? zahl(w.x) + (w.e ? ' ' + w.e : '') : ''; }
function mengeHtml(m, einheit, faktor = 1, ca = false){
  const w = mengeWert(m, einheit, faktor); if(!w) return '';
  return (ca ? '≈&nbsp;' : '') + zahlHtml(w.x) + (w.e ? `&nbsp;<small>${esc(w.e)}</small>` : '');
}
function zutatZeile(z, faktor){
  const m = mengeText(z.menge, z.einheit, faktor);
  return {m: (z.geschaetzt && m ? '≈ ' : '') + m, n: z.name + (z.hinweis ? ', ' + z.hinweis : '')};
}
function zutatenHtml(r, f){
  let html = '<ul class="zutaten">', gruppe = null;
  for(const z of r.zutaten || []){
    if((z.gruppe || null) !== gruppe){ gruppe = z.gruppe || null; if(gruppe) html += `</ul><h3 class="zutaten-gruppe">${esc(gruppe)}</h3><ul class="zutaten">`; }
    html += `<li><span class="m">${mengeHtml(z.menge, z.einheit, f, z.geschaetzt)}</span><span class="n">${esc(z.name)}${z.hinweis ? `<em>${esc(z.hinweis)}</em>` : ''}</span></li>`;
  }
  return (html + '</ul>').replace(/<ul class="zutaten"><\/ul>/g, '');
}

/* ---------- Thermomix-Angaben ---------- */
const TM_MUSTER = /\d+(?:[–-]\d+)?\s(?:Sek|Min)\.(?:\/(?:\d+\s°C|[A-Za-zäöüÄÖÜß]+(?:\s\d+)?))+/g;
// Werte im Schritttext als lavendelfarbene Marke, Umbruch nur nach „/“
const tmMarkieren = s => esc(s).replace(TM_MUSTER, m => `<span class="tmwert">${m.replace(/ /g, '&nbsp;').replace(/\//g, '/<wbr>')}</span>`);
// Erste Angabe im Schritt in Zeit / Temperatur / Stufe / Linkslauf zerlegen
function tmAngabe(s){
  const m = s.match(TM_MUSTER); if(!m) return null;
  const [zeit, ...rest] = m[0].split('/');
  const z = zeit.match(/^(\d+(?:[–-]\d+)?)\s(Sek|Min)/);
  const a = {zeit: z[1], einheit: z[2] === 'Min' ? 'Minuten' : 'Sekunden', sek: z[2] === 'Min' ? parseInt(z[1]) * 60 : parseInt(z[1]),
    temp: null, stufe: null, sanft: false, links: false, text: m[0]};
  for(const t of rest){
    if(/°C$/.test(t)) a.temp = t.replace(/\s°C$/, '');
    else if(t === 'Varoma') a.temp = 'Varoma';
    else if(t === 'Linkslauf') a.links = true;
    else if(t === 'Sanftrührstufe') a.sanft = true;
    else if(/^Stufe\s/.test(t)) a.stufe = t.replace(/^Stufe\s/, '');
    else a.stufe = t;
  }
  return a;
}

/* ---------- Navigation ---------- */

window.addEventListener('hashchange', zeigen);
document.addEventListener('click', e => {

const kopfZurueck = (text = 'Zurück') => `<header class="kopf"><button class="zurueck" data-zurueck>${ic('chevron-left')}${esc(text)}</button></header>`;
function titel(t){ document.title = t === 'Kochbuch' ? 'Kochbuch' : t + ' · Kochbuch'; }
function leiste(n){

function zeigen(){

  letzteSeite = teile[0] || 'start';
  if(teile[0] === 'kochen' && rezeptVon(teile[1])) return kochModus(rezeptVon(teile[1]));
  window.scrollTo(0, 0);
  if(teile[0] === 'rezept' && rezeptVon(teile[1])) return seiteRezept(main, rezeptVon(teile[1]));

/* ---------- Saison ---------- */
function saisonJetzt(){
  const m = new Date().getMonth() + 1;
  if(m === 11 || m === 12) return {tags:['Winter','Weihnachten'], name:'Winter', icon:'snowflake'};
  if(m <= 2) return {tags:['Winter'], name:'Winter', icon:'snowflake'};
  if(m <= 5) return {tags:['Frühling'], name:'Frühling', icon:'flower-2'};
  if(m <= 8) return {tags:['Sommer'], name:'Sommer', icon:'sun'};
  return {tags:['Herbst'], name:'Herbst', icon:'leaf'};
}
const saisonRezepte = () => { const s = saisonJetzt(); return DATEN.rezepte.filter(r => (r.saison || []).some(t => s.tags.includes(t))); };

/* ---------- Startseite ---------- */
const FILTER_STANDARD = {art:'alle'};
const filterAktuell = () => speicher.get('filter', FILTER_STANDARD);
function seiteStart(main){
  titel('Kochbuch'); leiste('start');

    <div class="filter" id="filter" role="group" aria-label="Filter"></div>

  const zeichne = () => {

// Filterknöpfe und Auswahllisten (einmal angemeldet, wirken nur auf der Startseite)
let startFilter = null;
$('#inhalt').addEventListener('click', e => {
  const b = e.target.closest('[data-filter]'); if(!b || letzteSeite !== 'start') return;
  e.preventDefault();
  const [art, wert] = b.dataset.filter.split('|');
  if(b.dataset.leeren) $('#suche').value = '';
  startFilter(art === 'alle' ? FILTER_STANDARD : {art, wert});
  if(art === 'saison') window.scrollTo(0, 0);
});
$('#inhalt').addEventListener('change', e => {
  const s = e.target.closest('select[data-g]'); if(!s || letzteSeite !== 'start') return;
  startFilter(s.value ? {art: s.dataset.g, wert: s.value} : FILTER_STANDARD);
});
function zaehle(gruppe){
  const z = {};
  DATEN.rezepte.forEach(r => (r[gruppe] || []).forEach(t => z[t] = (z[t] || 0) + 1));
  return z;
}
function filterLeiste(f){
  const knopf = (wert, inhalt, an) => `<button data-filter="${esc(wert)}" aria-pressed="${an}">${inhalt}</button>`;
  const wahl = (gruppe, name) => {
    const z = zaehle(gruppe), an = f.art === gruppe;
    const tags = Object.keys(z).sort((a, b) => z[b] - z[a] || sortDe(a, b));
    return `<label class="wahl ${an ? 'an' : ''}"><span>${esc(an ? f.wert : name)}</span>${ic('chevron-down', 'klein')}
      <select data-g="${gruppe}" aria-label="${esc(name)} wählen"><option value="">${an ? 'Alle Rezepte' : esc(name) + ' wählen'}</option>
      ${tags.map(t => `<option value="${esc(t)}" ${an && f.wert === t ? 'selected' : ''}>${esc(t)} (${z[t]})</option>`).join('')}</select></label>`;
  };
  const typen = zaehle('typ');
  const typListe = Object.keys(typen).filter(t => typen[t] >= 2).sort((a, b) => typen[b] - typen[a] || sortDe(a, b));
  return knopf('alle', `Alle <small>${DATEN.rezepte.length}</small>`, f.art === 'alle')
    + knopf('sterne', `${ic('star', 'klein')}Sterne`, f.art === 'sterne')
    + knopf('schnell', `${ic('clock', 'klein')}Schnell`, f.art === 'schnell')
    + wahl('anlass', 'Anlass') + wahl('hauptzutat', 'Zutat')
    + typListe.map(t => knopf('typ|' + t, esc(t), f.art === 'typ' && f.wert === t)).join('')
    + (f.art === 'saison' ? knopf('saison|' + f.wert, `${ic(saisonJetzt().icon, 'klein')}${esc(f.wert)}`, true) : '');
}
function gefiltert(f){
  if(f.art === 'alle' || f.art === 'sterne') return DATEN.rezepte;
  if(f.art === 'saison') return saisonRezepte();
  if(f.art === 'schnell') return DATEN.rezepte.filter(r => r.gesamtzeit && r.gesamtzeit <= SCHNELL);
  return DATEN.rezepte.filter(r => (r[f.art] || []).includes(f.wert));
}
const SCHNELL = 30;   // Minuten: Filter „Schnell“
const filterName = f => f.art === 'schnell' ? 'Schnell' : f.art === 'sterne' ? 'bewertete Rezepte' : f.art === 'saison' ? f.wert + 'rezepte' : f.wert;
function verzeichnis(f){
  if(!DATEN.rezepte.length) return '<section class="leer"><h2>Noch keine Rezepte</h2><p>Rezepte kommen über eine Claude-Sitzung ins Kochbuch.</p></section>';
  if(f.art === 'sterne') return nachSternen();
  const liste = [...gefiltert(f)].sort((a, b) => f.art === 'schnell' ? a.gesamtzeit - b.gesamtzeit || sortDe(a.titel, b.titel) : sortDe(a.titel, b.titel));
  if(f.art === 'schnell') return `<div class="raster-kopf erster"><h2>Schnell</h2><span>bis ${SCHNELL} Min., kürzeste zuerst</span></div>` + raster(liste);
  if(f.art === 'alle') return saisonBild() + `<div class="raster-kopf"><h2>Alle Rezepte</h2><span>A bis Z</span></div>` + raster(liste);
  return `<div class="raster-kopf erster"><h2>${esc(filterName(f))}</h2><span>${mehrzahl(liste.length, 'Rezept', 'Rezepte')}</span></div>` + raster(liste);
}
function saisonBild(){
  const s = saisonJetzt(), liste = saisonRezepte(), mitBild = liste.filter(r => r.bild);
  if(!mitBild.length) return '';
  const tag = Math.floor(Date.now() / 864e5);
  const r = mitBild[tag % mitBild.length];   // jeden Tag ein anderes
  return `<a class="saison vollbreit" href="#/rezept/${encodeURIComponent(r.id)}">
      <img src="${esc(r.bild)}" alt="" decoding="async">
      <div class="unter" style="padding-inline:var(--rand)"><span class="zeile">${ic(s.icon, 'klein')}Passt in den ${esc(s.name)}</span><h2>${esc(r.titel)}</h2></div></a>
    <a class="saison-link" href="#" data-filter="saison|${esc(s.name)}">Alle ${liste.length} ${esc(s.name)}rezepte ${ic('chevron-right', 'klein')}</a>`;
}
function suchen(q, basis = DATEN.rezepte){
  const w = q.toLowerCase().split(/\s+/).filter(Boolean);
  return basis.filter(r => {
    const text = [r.titel, r.kurzbeschreibung, ...(r.anlass||[]), ...(r.hauptzutat||[]), ...(r.typ||[]), ...(r.saison||[]),
      ...(r.zutaten||[]).map(z => z.name), r.anmerkungen].join(' ').toLowerCase();
    return w.every(x => text.includes(x));
  }).sort((a,b) => sortDe(a.titel, b.titel));
}
function suchErgebnis(q, f){
  const imFilter = f.art !== 'alle' && f.art !== 'sterne';
  const treffer = suchen(q, gefiltert(f));
  if(treffer.length) return `<div class="raster-kopf erster"><h2>${mehrzahl(treffer.length, 'Treffer', 'Treffer')}</h2><span>${imFilter ? 'in ' + esc(filterName(f)) : 'A bis Z'}</span></div>` + raster(treffer);
  const ueberall = imFilter ? suchen(q).length : 0;
  // Vorschläge: Hauptzutaten der Rezepte, die gerade in die Saison passen
  const z = {}; saisonRezepte().forEach(r => (r.hauptzutat || []).forEach(t => z[t] = (z[t] || 0) + 1));
  const vor = Object.keys(z).sort((a, b) => z[b] - z[a]).slice(0, 5);
  return `<section class="leer">${ic('search-x', 'gross')}
    <h2>Kein Rezept mit „${esc(q)}“</h2>
    <p>Gesucht in Titeln, Zutaten und Stichworten ${imFilter ? 'der ' + esc(filterName(f)) : 'aller ' + DATEN.rezepte.length + ' Rezepte'}.</p>
    ${vor.length ? `<p class="nebenkopf" style="margin-top:var(--space-m)">Passt gerade in den ${esc(saisonJetzt().name)}</p>
    <div class="vorschlaege" style="margin-top:0">${vor.map(t => `<button data-filter="hauptzutat|${esc(t)}" data-leeren="1">${esc(t)}<small>${z[t]}</small></button>`).join('')}</div>` : ''}
    <div class="knoepfe">${ueberall ? `<button class="knopf haupt" data-filter="alle">Im ganzen Kochbuch suchen (${ueberall})</button>` : ''}
      <button class="knopf neben" data-filter="${esc(f.art === 'alle' ? 'alle' : f.art + '|' + (f.wert || ''))}" data-leeren="1">${ic('x')}Suche löschen</button></div>
  </section>`;
}
const kurzTitel = t => t.split(' – ')[0];
// Gesamtzeit kurz: „45 Min.“, „1¼ Std.“, „3 Tage“
function dauerKurz(min){
  if(!min) return '';
  if(min < 60) return min + ' Min.';
  if(min < 1440) return zahl(Math.round(min / 15) / 4) + ' Std.';
  const t = Math.round(min / 1440 * 2) / 2; return zahl(t) + (t > 1 ? ' Tage' : ' Tag');
}
function kachel(r, mitSternen = false){
  const s = mitSternen ? sterneSchnitt(r.id) : 0;
  return `<li><a class="kachel" href="#/rezept/${encodeURIComponent(r.id)}">
    ${r.bild ? `<img src="${esc(vorschau(r))}" alt="" loading="lazy" decoding="async" width="400" height="400">` : '<img alt="">'}
    <b>${esc(kurzTitel(r.titel))}</b><span>${s ? `<span class="wert-s">${ic('star')}${zahl(Math.round(s * 10) / 10)}</span>` : ''}${r.gesamtzeit ? `<span class="dauer">${esc(dauerKurz(r.gesamtzeit))}</span>` : ''}<span class="art">${esc((r.typ || [])[0] || '')}</span>${hatTM(r) ? `<i class="tm" title="mit Thermomix-Fassung">${ic('x-thermomix')}<span class="sr">Thermomix</span></i>` : ''}</span></a></li>`;
}
const raster = (liste, mitSternen) => liste.length ? `<ul class="raster">${liste.map(r => kachel(r, mitSternen)).join('')}</ul>` : '<p class="hinweis">Keine Rezepte.</p>';

// Filter „Sterne“: Durchschnitt aller Kochtagebuch-Einträge (alle Leser), auf ganze Sterne gerundet
function nachSternen(){
  const gruppen = {5:[],4:[],3:[],2:[],1:[]}, ohne = [];
  DATEN.rezepte.forEach(r => { const s = sterneSchnitt(r.id); s ? gruppen[Math.min(5, Math.max(1, Math.round(s)))].push(r) : ohne.push(r); });
  const nachSchnitt = l => l.sort((a,b) => sterneSchnitt(b.id) - sterneSchnitt(a.id) || sortDe(a.titel, b.titel));
  const teile = [5,4,3,2,1].filter(n => gruppen[n].length).map((n, k) =>
    `<div class="raster-kopf ${k ? '' : 'erster'}"><h2><span class="sterne" aria-label="${n} von 5 Sternen">${sterneIcons(n)}</span></h2><span>${mehrzahl(gruppen[n].length, 'Rezept', 'Rezepte')}</span></div>` + raster(nachSchnitt(gruppen[n]), true));
  if(!teile.length) teile.push(`<section class="leer" style="padding-top:var(--space-l)">${ic('star', 'gross')}<h2>Noch nichts bewertet</h2>
    <p>Sterne vergibst du im Rezept ganz unten im Kochtagebuch, wenn du es gekocht hast.</p></section>`);
  if(ohne.length) teile.push(`<a class="zeilen-link" href="#/liste/sterne/unbewertet">Noch nicht bewertet<span>${ohne.length}${ic('chevron-right', 'klein')}</span></a>`);
  return teile.join('');
}
function sterneSchnitt(id){
  const e = (TB.eintraege[id] || []).filter(x => x.sterne);
  return e.length ? e.reduce((s,x) => s + x.sterne, 0) / e.length : 0;
}
const sterneIcons = n => [1,2,3,4,5].map(k => ic('star', k <= n ? 'voll' : 'aus')).join('');
function seiteListe(main, gruppe, tag){
  leiste('start');
  const unbewertet = gruppe === 'sterne';
  const liste = DATEN.rezepte.filter(r => unbewertet ? !sterneSchnitt(r.id) : (r[gruppe] || []).includes(tag)).sort((a,b) => sortDe(a.titel, b.titel));
  const t = unbewertet ? 'Noch nicht bewertet' : tag;

  main.innerHTML = kopfZurueck() + `<h1 class="titel" style="margin-top:0">${esc(t)}</h1>

/* ---------- Rezept ---------- */

function rezeptAlsText(r, p){
  const f = p / r.portionen;
  const zeilen = [r.titel, '', r.kurzbeschreibung, '', `Zutaten für ${p} Portion${p === 1 ? '' : 'en'}:`];
  let gruppe = null;
  for(const z of r.zutaten || []){
    if((z.gruppe||null) !== gruppe){ gruppe = z.gruppe || null; if(gruppe) zeilen.push('', gruppe + ':'); }
    const zz = zutatZeile(z, f); zeilen.push('• ' + (zz.m ? zz.m + ' ' : '') + zz.n);
  }
  zeilen.push('', 'Zubereitung:', ...(r.zubereitung || []).map((s, i) => `${i+1}. ${s}`));

// Liest die aktuelle Fassung direkt bei GitHub, ändert sie und schreibt sie verschlüsselt zurück.
async function tagebuchAendern(aenderung){
  if(!navigator.onLine) throw new Error('kein Internet');
  const api = `https://api.github.com/repos/${REPO}/contents/tagebuch.enc`;
  const h = {Authorization: 'Bearer ' + speicher.get('token', ''), Accept: 'application/vnd.github+json'};
  const r = await fetch(api, {headers: h, cache: 'no-store'});
  let sha, tb = {eintraege:{}};
  if(r.ok){ const j = await r.json(); sha = j.sha; tb = await entschluesseln(JSON.parse(atob(j.content.replace(/\s/g, ''))), SCHL.roh); }
  else if(r.status === 401 || r.status === 403) throw new Error('der GitHub-Schlüssel gilt nicht (mehr)');
  else if(r.status !== 404) throw new Error('GitHub antwortet mit ' + r.status);
  tb.eintraege ||= {};
  aenderung(tb);
  tb.stand = new Date().toISOString();
  const umschlag = await verschluesseln(tb, SCHL.roh, SCHL.salt, SCHL.iter);
  const w = await fetch(api, {method:'PUT', headers:{...h, 'Content-Type':'application/json'},
    body: JSON.stringify({message:'Kochtagebuch aktualisiert', content: btoa(JSON.stringify(umschlag)), ...(sha ? {sha} : {})})});
  if(!w.ok) throw new Error(w.status === 409 ? 'gleichzeitige Änderung, bitte nochmal' : 'GitHub antwortet mit ' + w.status);
  TB = tb; speicher.set('tagebuchLokal', tb); speicher.set('cache.tagebuch.enc', umschlag);
}

/* ---------- Kochmodus ---------- */
let wachHalter = null, kochTaste = null, kochMalen = null;
// Zeitangabe im klassischen Schritt; bei Spannen wie „45–60 Min.“ die kürzere Zeit: lieber früher nachsehen
function zeitAngabe(s){
  const u = s.match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(Min(?:\.|uten)?|Sek(?:\.|unden)?|Std(?:\.|unden)?)/i);
  if(!u) return null;
  const n = +u[1], art = /^Std/i.test(u[3]) ? 'Std.' : /^Sek/i.test(u[3]) ? 'Sek.' : 'Min.';
  return {sek: art === 'Std.' ? n*3600 : art === 'Sek.' ? n : n*60, text: n + ' ' + art};
}
// Zutaten, die im Schritttext vorkommen („Zwiebeln“ findet auch „Zwiebel“)
function zutatenImSchritt(r, s, f){
  const t = s.toLowerCase();
  const NICHT = ['frisch','frische','gemahlen','gehackt','etwas','große','kleine','groß','klein','weiße','weißer','schwarzer','brauner','zimmerwarm'];
  return (r.zutaten || []).filter(z => {
    const n = (z.name || '').toLowerCase().replace(/\(.*?\)/g, '');
    if(t.includes(n.trim())) return true;
    return n.split(/[\s,\/-]+/).filter(w => w.length >= 4 && !NICHT.includes(w)).some(w => t.includes(w.slice(0, Math.max(4, w.length - 2))));
  }).slice(0, 8).map(z => `<li>${z.menge != null ? `<b>${mengeHtml(z.menge, z.einheit, f, z.geschaetzt)}</b>` : ''}${esc(z.name)}</li>`).join('');
}

  kochMalen = malen;

  kochTaste = e => { if(e.key === 'ArrowRight') schritt(1); if(e.key === 'ArrowLeft') schritt(-1); if(e.key === 'Escape') history.back(); };
  document.addEventListener('keydown', kochTaste);

  let x0 = null, y0 = null;
  box.ontouchstart = e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; };

    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) schritt(dx < 0 ? 1 : -1);
  };
  malen();

/* ---------- Wecker ---------- */
let weckerZeit = null, weckerText = '', weckerTakt = null, ton = null;
function wecker(sek, text){
  weckerZeit = Date.now() + sek * 1000; weckerText = text;
  try{ ton = ton || new (window.AudioContext || window.webkitAudioContext)(); ton.resume(); }catch(e){}
  clearInterval(weckerTakt); weckerTakt = setInterval(weckerMalen, 1000);
  weckerMalen();
}
function weckerAus(){ clearInterval(weckerTakt); weckerTakt = null; weckerZeit = null; weckerMalen(); }
let geklingelt = false;
function weckerMalen(){
  const fest = $('#wecker'), imKoch = $('#kochWecker');
  const startKnopf = $('#uhrStart'); if(startKnopf) startKnopf.hidden = !!weckerZeit;
  if(!weckerZeit){ fest.hidden = true; fest.innerHTML = ''; if(imKoch) imKoch.innerHTML = ''; geklingelt = false; return; }
  const rest = Math.max(0, Math.round((weckerZeit - Date.now()) / 1000));
  const h = Math.floor(rest / 3600), mm = Math.floor(rest % 3600 / 60), ss = String(rest % 60).padStart(2, '0');
  const anzeige = h ? `${h}:${String(mm).padStart(2, '0')}:${ss}` : `${mm}:${ss}`;
  const html = `<div class="rest"><strong>${ic(rest ? 'timer' : 'alarm-clock')}${rest ? anzeige : 'Zeit!'}</strong><span>${rest ? 'Wecker ' + esc(weckerText) : esc(weckerText) + ' sind um'}</span></div>
    <button data-wecker="plus">+5 Min.</button><button data-wecker="aus" aria-label="Wecker aus">Aus</button>`;
  const ziel = imKoch || fest;
  if(imKoch){ fest.hidden = true; fest.innerHTML = ''; ziel.className = 'wecker-lauf'; ziel.setAttribute('role', 'timer'); }
  else fest.hidden = false;
  ziel.innerHTML = html;
  ziel.classList.toggle('klingelt', !rest);
  if(!rest && !geklingelt){ geklingelt = true; piep(); navigator.vibrate?.([400,200,400,200,400]); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-wecker]'); if(!b) return;
  if(b.dataset.wecker === 'aus') return weckerAus();
  weckerZeit = Math.max(weckerZeit, Date.now()) + 300000; geklingelt = false;
  if(!weckerTakt) weckerTakt = setInterval(weckerMalen, 1000);
  weckerMalen();
});
function piep(){
  if(!ton) return;
  for(let k = 0; k < 3; k++){ const o = ton.createOscillator(), g = ton.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ton.destination);
    const t = ton.currentTime + k * .5; g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .35); o.start(t); o.stop(t + .4); }
}

/* ---------- Einkauf ---------- */
function einkaufsPosten(){
  const ek = speicher.get('einkauf', []);
  const vorrat = speicher.get('vorratAn', false) ? speicher.get('vorrat', '').split('\n').map(s => s.trim().toLowerCase()).filter(Boolean) : [];
  const basis = {kg:['g',1000], g:['g',1], l:['ml',1000], ml:['ml',1], cl:['ml',10], dl:['ml',100]};
  const sammel = new Map();
  for(const {id, portionen} of ek){
    const r = rezeptVon(id); if(!r) continue;
    const f = portionen / r.portionen;
    for(const z of r.zutaten || []){
      if(z.einkauf === false) continue;
      const name = z.name.trim();
      if(vorrat.includes(name.toLowerCase())) continue;
      const e0 = (z.einheit || '').trim();
      const [e, mal] = basis[e0.toLowerCase()] || [e0, 1];
      const key = name.toLowerCase() + '|' + e.toLowerCase() + '|' + (z.menge == null ? 'x' : '');
      const p = sammel.get(key) || {name, einheit:e, menge:null, bereich: z.bereich || 'Sonstiges', rezepte:new Set()};
      if(z.menge != null) p.menge = (p.menge || 0) + z.menge * f * mal;
      p.rezepte.add(r.titel);
      sammel.set(key, p);
    }
  }
  return [...sammel.values()].map(p => {
    let m = '', mHtml = '';
    if(p.menge != null && ZAEHLBAR.includes(p.einheit.toLowerCase())){
      const n = Math.ceil(p.menge - 1e-9);
      m = n + (p.einheit ? ' ' + p.einheit : ''); mHtml = n + (p.einheit ? `&nbsp;<small>${esc(p.einheit)}</small>` : '');
    }else if(p.menge != null){ m = mengeText(p.menge, p.einheit); mHtml = mengeHtml(p.menge, p.einheit); }
    return {...p, m, mHtml, text: (m ? m + ' ' : '') + p.name, schluessel: p.name.toLowerCase() + '|' + p.einheit};
  });
}

    ${ios ? `<p class="hinweis">„In Erinnerungen übertragen“ braucht einmalig den Kurzbefehl „Kochbuch Einkauf“ – Anleitung unter <a href="#/mehr">Mehr</a>.</p>` : ''}
    <div class="ek-handlung"><div class="innen">
      ${ios ? `<button class="knopf haupt" id="erinnerungen">In Erinnerungen übertragen</button><button class="knopf neben" id="ekTeilen" aria-label="Als Text teilen">${ic('share')}</button>`
        : `<button class="knopf haupt" id="ekTeilen" style="grid-column:1/-1">${ic('share')}Als Text teilen</button>`}
    </div></div>`;

  const neu = () => { const y = window.scrollY; seiteEinkauf(main); window.scrollTo(0, y); };
  main.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
    const k = +b.dataset.k; ek[k].portionen = Math.max(1, ek[k].portionen + +b.dataset.d); speicher.set('einkauf', ek); neu();
  });
  main.querySelectorAll('[data-raus]').forEach(b => b.onclick = () => { ek.splice(+b.dataset.raus, 1); speicher.set('einkauf', ek); leiste('einkauf'); neu(); });
  const umschalten = li => { const s = li.dataset.s; hab.has(s) ? hab.delete(s) : hab.add(s); speicher.set('habIch', [...hab]); neu(); };
  main.querySelectorAll('.posten li').forEach(li => {
    li.onclick = () => umschalten(li);
    li.querySelector('.haken').onkeydown = e => { if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); umschalten(li); } };
  });
  const text = () => einkaufsPosten().filter(p => !hab.has(p.schluessel)).map(p => p.text);
  if($('#erinnerungen')) $('#erinnerungen').onclick = () => {
    const l = text(); if(!l.length){ meldung('Nichts zu übertragen.'); return; }
    location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Kochbuch Einkauf') + '&input=text&text=' + encodeURIComponent(l.join('\n'));
  };
  $('#ekTeilen').onclick = () => teilen('Einkaufsliste', text().join('\n'));
  $('#ekLeeren').onclick = () => { if(confirm('Einkaufszettel leeren?')){ speicher.set('einkauf', []); speicher.set('habIch', []); leiste('einkauf'); seiteEinkauf(main); } };
}

/* ---------- Mehr / Einstellungen ---------- */
function seiteMehr(main){
  titel('Mehr'); leiste('mehr');
  const token = speicher.get('token', ''), vorratAn = speicher.get('vorratAn', false);
  main.innerHTML = `<header class="kopf"><h1>Mehr</h1></header>
    <section class="abschnitt" style="padding-top:var(--space-xs)">
      <h2>Vorrat</h2>
      <div class="zeile-schalter" id="vorratZeile"><span id="vorratText">Vorrat beim Einkaufszettel abziehen</span><button class="schalter" id="vorratAn" role="switch" aria-checked="${vorratAn}" aria-labelledby="vorratText"></button></div>
      <div id="vorratFeld" ${vorratAn ? '' : 'hidden'}>
        <p class="hinweis" style="margin-top:var(--space-xs)">Was immer da ist – eine Zutat pro Zeile, so geschrieben wie im Rezept.</p>
        <textarea class="vorrat" id="vorrat" rows="4" aria-label="Vorrat" placeholder="Salz&#10;Pfeffer">${esc(speicher.get('vorrat', ''))}</textarea></div>
    </section>
    <section class="abschnitt">
      <h2>Kurzbefehl für Erinnerungen</h2>
      <p class="hinweis">Nur iPhone und iPad. Einmal in der App <b>Kurzbefehle</b> anlegen:</p>
      <ol class="anleitung">
        <li>„+“ tippen, den Kurzbefehl <b>Kochbuch Einkauf</b> nennen (genau so geschrieben).</li>
        <li>Aktion <b>Text aufteilen</b> hinzufügen (im Suchfeld „aufteilen“ eingeben, nicht „teilen“), bei „Text“ die <b>Kurzbefehleingabe</b> wählen, Trennzeichen <b>Neue Zeilen</b>.</li>
        <li>Aktion <b>Wiederholen mit jedem</b> hinzufügen (zeigt dann „Mit jedem Objekt aus Text aufteilen wiederholen“).</li>
        <li>Darin (eingerückt, vor „Wiederholung beenden“) die Aktion <b>Neue Erinnerung</b>: Text = Variable <b>Objekt wiederholen</b> (blaue Blase unter der Wiederholen-Zeile), Liste = <b>Family</b>.</li>
        <li>In den Details des Kurzbefehls einstellen: empfängt <b>Text</b>.</li>
      </ol>
      <p class="hinweis" style="margin-top:var(--space-xs)">Danach überträgt „In Erinnerungen übertragen“ jede Zeile als eigene Erinnerung.</p>
    </section>
    <section class="abschnitt">
      <h2>Bearbeiten (nur Christian)</h2>
      <p class="hinweis" style="margin-bottom:var(--space-xs)">Mit dem GitHub-Schlüssel kannst du Einträge ins Kochtagebuch schreiben. Er bleibt nur auf diesem Gerät.</p>
      <label class="feld">${ic('key-round')}<span class="sr">GitHub-Schlüssel</span><input type="password" id="token" placeholder="GitHub-Schlüssel" value="${esc(token)}" autocomplete="off"><button type="button" class="feldknopf" data-zeigen="token" aria-label="Schlüssel zeigen">${ic('eye')}</button></label>
      <div class="knoepfe"><button class="knopf haupt" id="tokenOk">Speichern</button><button class="knopf neben warn" id="tokenWeg">Entfernen</button></div>
    </section>
    <section class="abschnitt">
      <h2>Über</h2>
      <div class="ueber">${APPSYMBOL}<p><b>${DATEN.rezepte.length} Rezepte</b><br><span class="hinweis">Stand ${esc(new Date(DATEN.stand).toLocaleString('de-DE', {dateStyle:'medium', timeStyle:'short'}))} Uhr<br>App ${esc(VERSION)}</span></p></div>
      <div class="knoepfe"><button class="knopf neben" id="neuLaden">${ic('refresh-cw', 'klein')}Neu laden</button><button class="knopf neben" id="abmelden">${ic('log-out', 'klein')}Abmelden</button></div>
    </section>`;
  $('#vorratZeile').onclick = () => {
    const an = !speicher.get('vorratAn', false); speicher.set('vorratAn', an);
    $('#vorratAn').setAttribute('aria-checked', an); $('#vorratFeld').hidden = !an;
  };
  $('#vorrat').oninput = e => speicher.set('vorrat', e.target.value);
  $('#tokenOk').onclick = () => { speicher.set('token', $('#token').value.trim()); meldung('Gespeichert.'); };
  $('#tokenWeg').onclick = () => { speicher.weg('token'); $('#token').value = ''; meldung('Entfernt.'); };
  $('#neuLaden').onclick = () => location.reload();
  $('#abmelden').onclick = () => { if(confirm('Abmelden? Danach ist das Passwort nötig.')){ speicher.weg('schluessel'); location.hash = ''; location.reload(); } };
}

/* ---------- Kleinkram ---------- */
let meldungTakt;
function meldung(text, ms = 2500, aktion){
  const m = $('#meldung');
  m.innerHTML = `<span>${esc(text)}</span>${aktion ? `<a href="${esc(aktion.href)}">${esc(aktion.text)}</a>` : ''}`;
  m.hidden = false;
  const a = m.querySelector('a'); if(a) a.onclick = () => { m.hidden = true; };
  clearTimeout(meldungTakt); meldungTakt = setTimeout(() => m.hidden = true, ms);
}
function installHinweis(){
  const app = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(app || speicher.get('installGesehen', false)) return '';
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  return `<div class="installieren">${ic('smartphone')}<span>${ios ? 'Als App ablegen: unten auf <b>Teilen</b> tippen, dann <b>„Zum Home-Bildschirm“</b>.'
    : 'Als App ablegen: im Browser-Menü <b>„Zum Startbildschirm hinzufügen“</b> wählen.'}</span><button aria-label="Hinweis schließen">${ic('x', 'klein')}</button></div>`;
}

// Beim Zurückkehren in die App nach neuen Rezepten schauen (Home-Bildschirm-Apps starten nicht neu)
let zuletztGeprueft = Date.now();
// Kochmodus: Das System gibt die Bildschirmsperre beim App-Wechsel frei – beim Zurückkommen neu anfordern
document.addEventListener('visibilitychange', async () => {
  if(document.hidden || $('#koch').hidden || !navigator.wakeLock) return;
  if(!wachHalter || wachHalter.released){ try{ wachHalter = await navigator.wakeLock.request('screen'); }catch(e){} }
});
// Neue Rezepte holen. leise = ohne Meldung, wenn nichts Neues da ist
async function aktualisieren(leise){
  zuletztGeprueft = Date.now();
  const u = navigator.onLine === false ? null : await ladeUmschlag('daten.enc');
  if(!u){ if(!leise) meldung('Keine Verbindung – das Kochbuch bleibt auf dem letzten Stand.', 3500); return; }
  if(u.ct === UMSCHLAG.ct){ if(!leise) meldung('Kochbuch ist aktuell.'); return; }
  try{
    const neu = await entschluesseln(u, SCHL.roh);
    const vorher = DATEN.rezepte.length;
    UMSCHLAG = u; DATEN = neu; await ladeTagebuch();
    if($('#koch').hidden) zeigen();
    const mehr = DATEN.rezepte.length - vorher;
    meldung(mehr > 0 ? `Kochbuch aktualisiert: ${mehr} ${mehr === 1 ? 'neues Rezept' : 'neue Rezepte'}.` : 'Kochbuch aktualisiert.');
  }catch(e){ if(!leise) meldung('Aktualisieren hat nicht geklappt.'); }
}
document.addEventListener('visibilitychange', () => {
  if(document.hidden || !DATEN || !SCHL || Date.now() - zuletztGeprueft < 30000) return;
  aktualisieren(true);
});

// Startseite nach unten ziehen = aktualisieren
(() => {
  const SCHWELLE = 70, MAX = 110;
  const ring = document.createElement('div');
  ring.className = 'zieh'; ring.setAttribute('aria-hidden', 'true'); ring.innerHTML = ic('refresh-cw');
  document.body.append(ring);
  let y0 = null, weg = 0, laeuft = false;
  const setze = (d, sanft) => {
    ring.style.transition = sanft ? 'transform .25s, opacity .25s' : 'none';
    ring.style.transform = `translate(-50%, ${d - 56}px) rotate(${d * 3}deg)`;
    ring.style.opacity = Math.min(1, d / SCHWELLE);
    ring.classList.toggle('bereit', d >= SCHWELLE);
  };
  const erlaubt = () => letzteSeite === 'start' && DATEN && SCHL && !laeuft && $('#koch').hidden && !$('#app').hidden && window.scrollY <= 0;
  document.addEventListener('touchstart', e => { y0 = (e.touches.length === 1 && erlaubt()) ? e.touches[0].clientY : null; weg = 0; }, {passive: true});
  document.addEventListener('touchmove', e => {
    if(y0 === null) return;
    const d = e.touches[0].clientY - y0;
    if(d <= 0 || window.scrollY > 0){ if(weg){ weg = 0; setze(0, true); } return; }
    weg = Math.min(MAX, d * .5); setze(weg);
  }, {passive: true});
  document.addEventListener('touchend', async () => {
    if(y0 === null) return; y0 = null;
    if(weg < SCHWELLE){ weg = 0; setze(0, true); return; }
    laeuft = true; ring.classList.add('dreht'); setze(SCHWELLE, true);
    const anfang = Date.now();
    await aktualisieren(false);
    await new Promise(r => setTimeout(r, Math.max(0, 600 - (Date.now() - anfang))));
    ring.classList.remove('dreht'); weg = 0; setze(0, true); laeuft = false;
  });
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
start();
</script>
